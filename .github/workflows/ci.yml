name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests, lint et benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances système (Tesseract + langues, poppler, zbar)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr \
            tesseract-ocr-eng tesseract-ocr-fra tesseract-ocr-deu \
            tesseract-ocr-spa tesseract-ocr-ita tesseract-ocr-por \
            tesseract-ocr-nld tesseract-ocr-ara tesseract-ocr-rus \
            tesseract-ocr-chi-sim tesseract-ocr-tur \
            poppler-utils libzbar0

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installation du projet
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" 2>/dev/null || \
            python -m pip install -e . pytest ruff
          python -m pip install indra-ocr

      - name: Vérification de la version de Tesseract
        run: tesseract --version

      - name: Lint (ruff)
        run: ruff check src tests benchmarks

      - name: Tests (pytest)
        run: python -m pytest tests/ -q --no-header
        timeout-minutes: 15

      - name: Benchmark synthétique + terrain
        run: python benchmarks/run_field_benchmark.py --suite both

      - name: Vérification architecture web
        run: python -m pytest tests/test_web_architecture_refactored.py tests/test_xss_frontend.py -v --no-header

      - name: Rapport de benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-reports
          path: |
            benchmarks/results/latest.md
            benchmarks/results/field_latest.md
          if-no-files-found: warn

  docker:
    name: Image Docker
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build de l'image
        run: docker build -t unocr:ci .

      - name: Démarrage et santé
        run: |
          docker run -d --name unocr-ci -p 8000:8000 unocr:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health > /dev/null; then
              echo "API en bonne santé"; exit 0
            fi
            sleep 2
          done
          echo "l'API n'a pas répondu"; docker logs unocr-ci; exit 1

      - name: Test API de base
        run: |
          curl -fsS http://127.0.0.1:8000/docs | grep -q "Swagger UI" && echo "OpenAPI OK"
          curl -fsS http://127.0.0.1:8000/ | grep -q "UniOCR" && echo "UI OK"
          curl -fsS http://127.0.0.1:8000/api/security | python -m json.tool
          curl -fsS http://127.0.0.1:8000/api/health | python -m json.tool

      - name: Capture écran UI
        run: |
          # Installation de tools de capture
          sudo apt-get install -y --no-install-recommends xvfb chromium-browser
          Xvfb :99 -screen 0 1280x1024x24 &
          export DISPLAY=:99
          chromium-browser --headless --disable-gpu --screenshot=/tmp/unocr-screenshot.png \
            http://127.0.0.1:8000/ 2>/dev/null || true
          ls -la /tmp/unocr-screenshot.png

      - name: Upload capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshot
          path: /tmp/unocr-screenshot.png
          if-no-files-found: warn

      - name: Nettoyage
        if: always()
        run: docker rm -f unocr-ci
