name: Recette documentaire ciblee

on:
  push:
    branches: [main, master, arena/2cd4c91a-ocr-universal]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  customs-review:
    name: Selection documentaire et JSDOM (pas suite OCR complete)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Installation stricte des dependances Python et Node
        run: |
          python -m pip install -e ".[dev,baidu]"
          npm ci
      - name: Cloisonnement des corrections et annulations documentaires
        run: |
          mkdir -p "$RUNNER_TEMP/customs-review"
          python -m pytest tests/test_demo_corrections.py tests/test_field_audit_actor.py tests/test_field_patch_noop.py tests/test_field_patch_status.py tests/test_undo_audit_selection.py tests/test_field_revision.py tests/test_classification_revision.py tests/test_auto_classification_persistence.py tests/test_classification_read_consistency.py tests/test_manual_classification_persistence.py tests/test_empty_field_values.py tests/test_annulation_correction.py tests/test_ocr_audit_actor.py tests/test_ocr_missing_field.py tests/test_ocr_dossier_scope.py tests/test_field_correction_scope.py tests/test_rbac.py tests/test_rbac_ecritures.py tests/test_rbac_reprise.py -q --junitxml="$RUNNER_TEMP/customs-review/field-correction-scope.xml"
      - name: Qualite des pages et Baidu (sans appel externe)
        run: |
          mkdir -p "$RUNNER_TEMP/customs-review"
          python -m pytest tests/test_zero_field_quality.py tests/test_failed_page_quality.py tests/test_baidu_geometry.py tests/test_confidence_provenance.py tests/test_baidu_confidence.py tests/test_baidu_transport.py tests/test_baidu_ocr.py -q --junitxml="$RUNNER_TEMP/customs-review/baidu-transport.xml"
      - name: PDFium concurrent et duree de vie native (serveur isole)
        run: |
          mkdir -p "$RUNNER_TEMP/customs-review"
          python -m pytest tests/test_ingest.py tests/test_pdf_ingest_lifecycle.py tests/test_pdf_ingest_concurrency.py tests/test_pdf_upload_concurrency.py -q --junitxml="$RUNNER_TEMP/customs-review/pdf-concurrency.xml"
      - name: Rendu des modules servis et refus des faux succes (serveur isole)
        run: |
          mkdir -p "$RUNNER_TEMP/customs-review"
          python -m pytest tests/test_ui_render_contract.py tests/test_ui_dossier.py tests/test_ui_engine_provenance.py -q --junitxml="$RUNNER_TEMP/customs-review/ui-served.xml"
      - name: Diagnostic des echecs PDF et rendu (annotations GitHub)
        if: failure()
        run: |
          python - <<'PYCODE'
          import os
          import pathlib
          import xml.etree.ElementTree as ET
          directory = pathlib.Path(os.environ["RUNNER_TEMP"]) / "customs-review"
          for path in directory.glob("*.xml"):
              for case in ET.parse(path).iter("testcase"):
                  for failure in list(case):
                      if failure.tag in {"error", "failure"}:
                          text = (case.get("name", "") + "\n" + (failure.text or ""))[-12000:]
                          text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                          print("::error::" + text)
          PYCODE
      - name: Recette ciblee avec donnees temporaires
        run: python scripts/customs_review_recipe.py --artifacts "$RUNNER_TEMP/customs-review"
      - name: Journaux, JUnit et bilan cible (meme en echec)
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: customs-review-targeted-results
          path: ${{ runner.temp }}/customs-review/
          if-no-files-found: warn
