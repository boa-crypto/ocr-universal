name: Recette documentaire ciblee

on:
  push:
    branches: [main, master, arena/2cd4c91a-ocr-universal]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  customs-review:
    name: Selection documentaire et JSDOM (pas suite OCR complete)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Installation stricte des dependances Python et Node
        run: |
          python -m pip install -e ".[dev]"
          npm ci
      - name: Rendu des modules servis et refus des faux succes (serveur isole)
        run: |
          mkdir -p "$RUNNER_TEMP/customs-review"
          python -m pytest tests/test_ui_render_contract.py tests/test_ui_dossier.py -q --junitxml="$RUNNER_TEMP/customs-review/ui-served.xml"
      - name: Diagnostic des echecs de rendu (annotations GitHub)
        if: failure()
        run: |
          python - <<'PYCODE'
          import os
          import pathlib
          import xml.etree.ElementTree as ET
          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "customs-review/ui-served.xml"
          if path.is_file():
              for case in ET.parse(path).iter("testcase"):
                  for failure in list(case):
                      if failure.tag in {"error", "failure"}:
                          text = (case.get("name", "") + "\n" + (failure.text or ""))[-12000:]
                          text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                          print("::error::" + text)
          PYCODE
      - name: Recette ciblee avec donnees temporaires
        run: python scripts/customs_review_recipe.py --artifacts "$RUNNER_TEMP/customs-review"
      - name: Journaux, JUnit et bilan cible (meme en echec)
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: customs-review-targeted-results
          path: ${{ runner.temp }}/customs-review/
          if-no-files-found: warn
